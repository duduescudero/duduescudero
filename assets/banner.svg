<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="460" viewBox="0 0 1584 460" role="img" aria-labelledby="title description">
  <title id="title">Eduardo Escudero — Engenharia de Software · FIAP</title>
  <desc id="description">Apresentação escura com detalhes roxos, órbitas e monograma ee. Ideias ganham forma. Código faz acontecer.</desc>
