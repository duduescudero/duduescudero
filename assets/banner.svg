    <linearGradient id="edge"><stop stop-color="#b69cff" stop-opacity=".65"/><stop offset="1" stop-color="#b69cff" stop-opacity=".12"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#b69cff" stroke-opacity=".035"/></pattern>
